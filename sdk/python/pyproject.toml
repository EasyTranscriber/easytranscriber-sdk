[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "easytranscriber-sdk"
version = "0.1.0"
description = "Synchronous and asynchronous Python clients for the EasyTranscriber REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/EasyTranscriber/easytranscriber-sdk"
Documentation = "https://github.com/EasyTranscriber/easytranscriber-sdk/blob/main/sdk/python/README.md"
Source = "https://github.com/EasyTranscriber/easytranscriber-sdk"
Issues = "https://github.com/EasyTranscriber/easytranscriber-sdk/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
  "twine>=5,<7",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/easytranscriber_sdk"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
only-include = ["src", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/easytranscriber_sdk"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
